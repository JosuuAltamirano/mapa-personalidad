# Pasa las pruebas del cálculo y, si todo va bien, publica la carpeta web/ en GitHub Pages.
name: Pruebas y publicación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cálculo de la base
        run: node tests/run.mjs
      - name: Cálculo de la web
        run: BASE_DIR=web node tests/run.mjs
      - name: data.js y model.js iguales que en la base
        run: cmp base/data.js web/data.js && cmp base/model.js web/model.js

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
